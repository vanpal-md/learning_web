<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funciones</title>
    <script>
        function suma(a, b) {
            return a + b;
        }
        function resta_nf(a, b) {
            console.log("El valor de la resta es: "+ a - b);
        }
        function resta_f(a, b) {
            console.log("El valor de la resta es: "+ (a - b));
        }
        multiply = function (a, b) {
            console.log (a*b);
        }
    </script>
</head>
<body>
    <nav><a href="../index.html">Volver al Inicio</a></nav>
    <h1>Funciones</h1>
    <script>
        res = suma(5, 13);
        // suma(2, 1);
        // suma(2, 2);
        // suma(2, 3);
        // suma(2, 4);
        // suma(2, 5);
        // suma(2, 6);
        console.log (res);
        multiply(5,5);
        resta_nf(8,5);
        resta_f(8,5);
    </script>
</body>
</html>
